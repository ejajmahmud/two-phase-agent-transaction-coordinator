[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "two-phase-agent-transaction-coordinator"
version = "0.1.0"
description = "Two-phase commit (2PC) coordinator for atomic multi-agent side effects, state mutations, and compensatory rollbacks"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [
    {name = "Ejaj Mahmud", email = "dev@ejajmahmud.com"}
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
]
dependencies = []

[project.scripts]
two-phase-agent-transaction-coordinator = "two_phase_agent_transaction_coordinator.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["two_phase_agent_transaction_coordinator*"]
